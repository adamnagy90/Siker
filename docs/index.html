<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sikér | Legfrissebb PDF</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Latin Modern Roman", "CMU Serif", "Palatino Linotype", Georgia, serif;
        background: #f4f5f6;
        color: #191919;
      }

      * { box-sizing: border-box; }
      body {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }
      header {
        min-height: 4.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem clamp(1rem, 3vw, 2.75rem);
        background: #fff;
        border-bottom: 1px solid #d9dcdf;
      }
      .identity { display: flex; align-items: baseline; gap: 0.8rem; }
      h1 { margin: 0; font-size: 1.45rem; line-height: 1; font-weight: 600; }
      .edition {
        margin: 0;
        color: #686b70;
        font-size: 0.9rem;
      }
      .download {
        padding: 0.65rem 0.9rem;
        border: 1px solid #762b38;
        background: #762b38;
        color: #fff;
        font-size: 0.95rem;
        text-decoration: none;
        transition: background-color 140ms ease, border-color 140ms ease;
      }
      .download:hover { background: #5f202c; border-color: #5f202c; }
      .download:focus-visible { outline: 2px solid #191919; outline-offset: 3px; }
      main { min-height: 0; padding: clamp(0.5rem, 1.5vw, 1.25rem); }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 70vh;
        border: 1px solid #d9dcdf;
        background: #fff;
      }
      @media (max-width: 520px) {
        header { min-height: 4rem; gap: 0.6rem; }
        .identity { display: block; }
        h1 { font-size: 1.25rem; }
        .edition { margin-top: 0.25rem; font-size: 0.8rem; }
        .download { padding: 0.55rem 0.65rem; font-size: 0.85rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="identity">
        <h1>Sikér</h1>
        <p class="edition">Receptgyűjtemény · PDF</p>
      </div>
      <a class="download" href="main.pdf" download>PDF letöltése</a>
    </header>
    <main>
      <iframe src="main.pdf" title="Sikér - legfrissebb PDF">
        <p>A PDF nem jeleníthető meg. <a href="main.pdf">Töltsd le a dokumentumot.</a></p>
      </iframe>
    </main>
  </body>
</html>
